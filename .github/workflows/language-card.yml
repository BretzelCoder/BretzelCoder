name: Language card

# Weekly, an hour after the consistency check, plus a manual trigger from the
# Actions tab. When the language breakdown changed, the regenerated card goes
# up as a pull request so nothing lands on main without a review.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: language-card
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BRANCH: chore/update-language-card

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate the card
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python .github/scripts/update_language_card.py

      - name: Open or update the pull request
        run: |
          if [ -z "$(git status --porcelain -- assets/top-languages.svg)" ]; then
            echo "The language breakdown is unchanged — nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add assets/top-languages.svg
          git commit -m "Update the language card"
          # One fixed branch: a PR still open from a previous week is refreshed
          # in place instead of piling up a second one.
          git push --force origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Refreshed the open PR #$existing"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Update the language card" \
              --body "The language breakdown across the public repositories changed. Regenerated by the **Language card** workflow."
          fi
