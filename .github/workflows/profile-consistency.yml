name: Profile consistency

# Weekly, plus a manual trigger from the Actions tab whenever you want it.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only — do not open, update or close any issue"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: profile-consistency
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ISSUE_TITLE: "Profile README has drifted from its repositories"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the consistency check
        id: check
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          set +e
          python .github/scripts/check_profile_consistency.py > report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Publish the report to the run summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Exit code 2 means the script itself could not run — a broken README
      # layout or an API failure. That is a real failure, not profile drift.
      - name: Fail when the check could not complete
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "The consistency script could not complete. See the log above."
          exit 1

      - name: Open or update the drift issue
        if: steps.check.outputs.exit_code == '1' && inputs.dry_run != true
        run: |
          existing=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == env.ISSUE_TITLE) | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
            echo "Commented on existing issue #$existing"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file report.md
          fi

      - name: Close the drift issue once everything matches
        if: steps.check.outputs.exit_code == '0' && inputs.dry_run != true
        run: |
          existing=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == env.ISSUE_TITLE) | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The README now matches the repositories. Closing automatically."
            echo "Closed issue #$existing"
          else
            echo "No drift and no open issue — nothing to do."
          fi
